<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva contraseña · SpainFishing</title>
<style>
  :root { --azul:#0D47A1; --azul2:#1565C0; --gris:#455A64; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg,#1565C0 0%,#0D47A1 60%,#062b5b 100%);
    padding:18px;
  }
  .tarjeta {
    background:#fff; border-radius:18px; max-width:430px; width:100%;
    padding:26px 24px 22px; box-shadow:0 18px 50px rgba(0,0,0,.28);
  }
  .logo { display:block; width:100%; max-width:280px; margin:0 auto 14px; border-radius:10px; }
  h1 { font-size:19px; color:var(--azul); margin:0 0 6px; text-align:center; }
  p.sub { font-size:14px; color:var(--gris); text-align:center; margin:0 0 18px; line-height:1.45; }
  label { display:block; font-size:13px; color:#37474F; margin:14px 0 6px; font-weight:600; }
  input {
    width:100%; padding:13px 14px; font-size:16px; border:1.5px solid #CFD8DC;
    border-radius:10px; outline:none;
  }
  input:focus { border-color:var(--azul2); }
  button {
    width:100%; margin-top:20px; padding:14px; font-size:16px; font-weight:600;
    color:#fff; background:var(--azul); border:0; border-radius:10px; cursor:pointer;
  }
  button:disabled { opacity:.55; }
  .aviso { margin-top:14px; font-size:13.5px; padding:11px 12px; border-radius:9px; display:none; line-height:1.45; }
  .error { background:#FFEBEE; color:#B71C1C; display:block; }
  .ok { background:#E8F5E9; color:#1B5E20; display:block; }
  .pie { margin-top:18px; font-size:12px; color:#78909C; text-align:center; line-height:1.5; }
  .req { font-size:12px; color:#78909C; margin-top:6px; }
</style>
</head>
<body>
<div class="tarjeta">
  <img class="logo" src="logo.png" alt="SpainFishing">
  <h1>Elige tu nueva contraseña</h1>
  <p class="sub">Escríbela dos veces para asegurarnos de que no hay erratas.</p>

  <form id="form">
    <label for="p1">Nueva contraseña</label>
    <input id="p1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required>
    <label for="p2">Repite la nueva contraseña</label>
    <input id="p2" type="password" autocomplete="new-password" placeholder="Otra vez, igual" required>
    <div class="req">Mínimo 6 caracteres. Mejor con mayúsculas y algún número.</div>
    <button id="btn" type="submit">Guardar contraseña</button>
  </form>

  <div id="msg" class="aviso"></div>
  <div class="pie">SpainFishing · Pesca España<br>Si no has pedido este cambio, cierra esta página.</div>
</div>

<script>
  // Clave publica del proyecto (la misma que usa la app; no es un secreto)
  var API_KEY = "AIzaSyDaaij5ika0rNr_hDUF8soFin9Ujyio-MM";

  var params = new URLSearchParams(window.location.search);
  var oob = params.get("oobCode");
  var msg = document.getElementById("msg");
  var btn = document.getElementById("btn");

  function avisar(texto, tipo) {
    msg.className = "aviso " + tipo;
    msg.textContent = texto;
  }

  if (!oob) {
    avisar("Este enlace no es válido o está incompleto. Pide otro correo de recuperación desde la app.", "error");
    btn.disabled = true;
  }

  document.getElementById("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var p1 = document.getElementById("p1").value;
    var p2 = document.getElementById("p2").value;

    if (p1.length < 6) {
      avisar("La contraseña debe tener al menos 6 caracteres.", "error");
      return;
    }
    if (p1 !== p2) {
      avisar("Las dos contraseñas no coinciden. Revísalas.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Guardando…";

    fetch("https://identitytoolkit.googleapis.com/v1/accounts:resetPassword?key=" + API_KEY, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ oobCode: oob, newPassword: p1 })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok) {
          avisar("✅ Contraseña cambiada. Ya puedes entrar en la app con la nueva.", "ok");
          document.getElementById("form").style.display = "none";
          btn.textContent = "Guardada";
          return;
        }
        var code = (res.d && res.d.error && res.d.error.message) || "";
        var texto = "No se pudo cambiar. Pide otro enlace desde la app.";
        if (code.indexOf("EXPIRED") >= 0) texto = "El enlace ha caducado (vale 1 hora). Pide otro desde la app.";
        else if (code.indexOf("INVALID") >= 0) texto = "El enlace no es válido o ya se ha usado. Pide otro desde la app.";
        else if (code.indexOf("WEAK_PASSWORD") >= 0) texto = "Esa contraseña es demasiado débil. Prueba con una más larga.";
        avisar(texto, "error");
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
      })
      .catch(function () {
        avisar("Sin conexión. Comprueba tu internet e inténtalo otra vez.", "error");
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
      });
  });
</script>
</body>
</html>
